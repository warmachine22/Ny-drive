name: Roach readiness

on:
  push:
    branches: [main]
    paths:
      - '.agent/**'
      - 'scripts/roach.py'
      - 'scripts/roach_check.py'
      - 'schemas/**'
      - '.github/workflows/roach-ready.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Roach repository state
        run: python3 scripts/roach_check.py
      - name: Check execution readiness
        run: python3 scripts/roach.py ready
