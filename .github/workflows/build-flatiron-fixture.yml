name: Build Flatiron fixture

on:
  push:
    branches:
      - 'roach/T004-chatgpt-nydrive-a830'
    paths:
      - 'tools/map_compiler/src/**'
      - 'tools/map_compiler/tests/**'
      - 'tools/map_compiler/scripts/compile_flatiron_fixture.py'
      - 'tools/map_compiler/fixtures/flatiron/source_snapshot.json'
      - '.github/workflows/build-flatiron-fixture.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler dependencies
        run: python3 -m pip install -e 'tools/map_compiler[test]'
      - name: Run T004 tile and seam tests
        run: python3 -m pytest tools/map_compiler/tests -k 'tile or seam or fixture'
      - name: Compile runtime fixture
        run: python3 tools/map_compiler/scripts/compile_flatiron_fixture.py
      - name: Commit deterministic compiled tiles
        shell: bash
        run: |
          git config user.email "roach-ci@example.invalid"
          git config user.name "Roach CI"
          git add tools/map_compiler/fixtures/flatiron/compiled
          if git diff --cached --quiet; then
            echo "Compiled fixture already matches source and compiler."
          else
            git commit -m "T004: generate Flatiron 256m runtime tiles"
            git push origin HEAD:roach/T004-chatgpt-nydrive-a830
          fi
