name: T011 refresh Flatiron scenery fixture

on:
  push:
    branches:
      - roach/T011-chatgpt-nydrive-0831d
    paths:
      - .github/workflows/t011-refresh-fixture.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roach/T011-chatgpt-nydrive-0831d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler
        run: python -m pip install -e tools/map_compiler
      - name: Acquire current Flatiron source snapshot
        run: python tools/map_compiler/scripts/acquire_flatiron_fixture.py --output tools/map_compiler/fixtures/flatiron/source_snapshot.json
      - name: Compile runtime fixture
        run: python tools/map_compiler/scripts/compile_flatiron_fixture.py
      - name: Commit generated fixture
        run: |
          git config user.name "nydrive-fixture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/map_compiler/fixtures/flatiron/source_snapshot.json tools/map_compiler/fixtures/flatiron/compiled
          if git diff --cached --quiet; then
            echo "Fixture already current"
          else
            git commit -m "data(T011): refresh Flatiron building massing fixture"
            git push origin HEAD:roach/T011-chatgpt-nydrive-0831d
          fi
