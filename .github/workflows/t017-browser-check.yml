name: T017 browser verification

on:
  push:
    branches:
      - roach/T017-chatgpt-nydrive-a830
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/t017-browser-check.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install project and browser tooling
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/nydrive-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nydrive-vite.log
          exit 1
      - name: Depart Roadbed and recover
        run: |
          mkdir -p browser-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on('console', message => {
            if (message.type() === 'error') errors.push(message.text());
          });
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          const status = () => page.locator('.hud__status').innerText();

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1600);
          const initial = await status();
          await page.screenshot({ path: 'browser-artifacts/01-initial.png', fullPage: true });

          // Accelerate along the spawn road, rotate only partway toward a right turn,
          // then release steering and keep driving diagonally. That deliberately cuts
          // through block interior rather than following the perpendicular street.
          await page.keyboard.down('w');
          await page.waitForTimeout(1600);
          await page.keyboard.down('d');
          await page.waitForTimeout(520);
          await page.keyboard.up('d');
          await page.waitForTimeout(2900);
          await page.keyboard.up('w');
          await page.waitForTimeout(900);
          const offroad = await status();
          await page.screenshot({ path: 'browser-artifacts/02-offroad-supported.png', fullPage: true });

          await page.keyboard.press('r');
          await page.waitForTimeout(1400);
          const recovered = await status();
          await page.screenshot({ path: 'browser-artifacts/03-road-reset.png', fullPage: true });

          fs.writeFileSync(
            'browser-artifacts/result.json',
            JSON.stringify({ initial, offroad, recovered, errors }, null, 2),
          );
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: t017-support-verification
          path: browser-artifacts
          if-no-files-found: error
