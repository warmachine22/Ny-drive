name: T017 browser verification

on:
  push:
    branches:
      - roach/T017-chatgpt-nydrive-a830
    paths:
      - 'src/**'
      - 'tools/map_compiler/fixtures/flatiron/compiled/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/t017-browser-check.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install project and browser tooling
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/nydrive-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nydrive-vite.log
          exit 1
      - name: Verify support physics and road recovery
        run: |
          mkdir -p browser-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on('console', message => {
            if (message.type() === 'error') errors.push(message.text());
          });
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          const status = () => page.locator('.hud__status').innerText();

          async function waitForHud(predicate, timeoutMs, description) {
            const started = Date.now();
            let latest = await status();
            while (Date.now() - started < timeoutMs) {
              latest = await status();
              if (predicate(latest)) return latest;
              await page.waitForTimeout(80);
            }
            throw new Error(`${description}; latest HUD: ${latest}`);
          }

          await page.goto('http://127.0.0.1:4173/?verification=t017', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1600);
          const initial = await waitForHud(
            text => text.includes('surface roadbed') && text.includes('wheels 4/4'),
            2500,
            'Expected stable Roadbed spawn',
          );
          await page.screenshot({ path: 'browser-artifacts/01-initial.png', fullPage: true });

          const candidate = await page.evaluate(async () => {
            const hook = window.__NYDRIVE_T017__;
            if (!hook) throw new Error('Missing branch-only T017 verification hook');
            return await hook.teleportToSupport();
          });
          if (!candidate) throw new Error('Loaded fixture had no nearby support candidate');

          // The real dynamic chassis starts above the lower support slab. Let gravity,
          // suspension rays and Rapier contacts settle it; do not fake wheel state.
          const offroad = await waitForHud(
            text => text.includes('surface support') && text.includes('wheels 4/4'),
            3500,
            'Vehicle did not settle on streamed support with four wheel contacts',
          );
          await page.waitForTimeout(500);
          const settledOffroad = await status();
          if (!settledOffroad.includes('surface support') || !settledOffroad.includes('wheels 4/4')) {
            throw new Error(`Support state was not stable after settling; HUD: ${settledOffroad}`);
          }
          await page.screenshot({ path: 'browser-artifacts/02-offroad-supported.png', fullPage: true });

          await page.keyboard.press('r');
          const recovered = await waitForHud(
            text => text.includes('surface roadbed') && text.includes('wheels 4/4'),
            3500,
            'Normal R reset did not recover from support to Roadbed',
          );
          await page.screenshot({ path: 'browser-artifacts/03-road-reset.png', fullPage: true });

          fs.writeFileSync(
            'browser-artifacts/result.json',
            JSON.stringify({ initial, candidate, offroad, settledOffroad, recovered, errors }, null, 2),
          );
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: t017-support-verification
          path: browser-artifacts
          if-no-files-found: error
