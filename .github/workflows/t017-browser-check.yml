name: T017 browser verification

on:
  push:
    branches:
      - roach/T017-chatgpt-nydrive-a830
    paths:
      - 'src/**'
      - 'tools/map_compiler/fixtures/flatiron/compiled/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/t017-browser-check.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install project and browser tooling
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/nydrive-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nydrive-vite.log
          exit 1
      - name: Depart Roadbed and recover
        run: |
          mkdir -p browser-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on('console', message => {
            if (message.type() === 'error') errors.push(message.text());
          });
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          const status = () => page.locator('.hud__status').innerText();

          async function releaseDrivingKeys() {
            for (const key of ['w', 'a', 'd', 'Space']) {
              await page.keyboard.up(key).catch(() => {});
            }
          }

          async function waitForSurface(kind, timeoutMs) {
            const started = Date.now();
            let latest = await status();
            while (Date.now() - started < timeoutMs) {
              latest = await status();
              if (latest.includes(`surface ${kind}`)) return latest;
              await page.waitForTimeout(80);
            }
            return null;
          }

          async function resetToRoadbed() {
            await releaseDrivingKeys();
            await page.keyboard.press('r');
            await page.waitForTimeout(900);
            const roadbed = await waitForSurface('roadbed', 1800);
            if (!roadbed) throw new Error(`Reset did not return to Roadbed; HUD: ${await status()}`);
          }

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1600);
          const initial = await status();
          if (!initial.includes('surface roadbed')) {
            throw new Error(`Expected Roadbed spawn on Avenue of the Americas; HUD: ${initial}`);
          }
          await page.screenshot({ path: 'browser-artifacts/01-initial.png', fullPage: true });

          // The spawn is on Avenue of the Americas. Search a small set of brief right
          // steering pulses, then travel straight: this deliberately tests a shallow
          // curb crossing rather than a 90-degree turn that can land on W 24/25 St.
          const pulseDurationsMs = [180, 260, 340, 420, 520, 650];
          let offroad = null;
          let successfulPulseMs = null;
          for (const pulseMs of pulseDurationsMs) {
            await resetToRoadbed();
            await page.keyboard.down('w');
            await page.waitForTimeout(1900);
            await page.keyboard.down('d');
            await page.waitForTimeout(pulseMs);
            await page.keyboard.up('d');

            const reached = await waitForSurface('support', 2300);
            if (reached) {
              offroad = reached;
              successfulPulseMs = pulseMs;
              await releaseDrivingKeys();
              break;
            }
            await releaseDrivingKeys();
          }

          if (!offroad) {
            throw new Error(`No curb-cut pulse reached support; latest HUD: ${await status()}`);
          }
          await page.waitForTimeout(500);
          offroad = await status();
          if (!offroad.includes('surface support')) {
            throw new Error(`Car did not remain on support after input release; HUD: ${offroad}`);
          }
          if (!offroad.includes('wheels 4/4')) {
            throw new Error(`Expected four supported wheel contacts off-road; HUD: ${offroad}`);
          }
          await page.screenshot({ path: 'browser-artifacts/02-offroad-supported.png', fullPage: true });

          await resetToRoadbed();
          const recovered = await status();
          await page.screenshot({ path: 'browser-artifacts/03-road-reset.png', fullPage: true });

          fs.writeFileSync(
            'browser-artifacts/result.json',
            JSON.stringify({ initial, successfulPulseMs, offroad, recovered, errors }, null, 2),
          );
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: t017-support-verification
          path: browser-artifacts
          if-no-files-found: error
