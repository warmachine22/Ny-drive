name: T016 browser verification

on:
  push:
    branches:
      - roach/T016-chatgpt-nydrive-a830
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/t016-browser-check.yml'
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install project and browser tooling
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/nydrive-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nydrive-vite.log
          exit 1
      - name: Capture camera states
        run: |
          mkdir -p browser-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on('console', message => {
            if (message.type() === 'error') errors.push(message.text());
          });
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1600);
          const stationary = await page.locator('.hud__status').innerText();
          await page.screenshot({ path: 'browser-artifacts/01-stationary.png', fullPage: true });

          await page.keyboard.down('w');
          await page.waitForTimeout(2300);
          const straight = await page.locator('.hud__status').innerText();
          await page.screenshot({ path: 'browser-artifacts/02-straight.png', fullPage: true });

          await page.keyboard.down('d');
          await page.waitForTimeout(1000);
          await page.keyboard.up('d');
          await page.waitForTimeout(500);
          await page.keyboard.up('w');
          const turning = await page.locator('.hud__status').innerText();
          await page.screenshot({ path: 'browser-artifacts/03-turning.png', fullPage: true });

          fs.writeFileSync('browser-artifacts/result.json', JSON.stringify({ stationary, straight, turning, errors }, null, 2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: t016-camera-verification
          path: browser-artifacts
          if-no-files-found: error
