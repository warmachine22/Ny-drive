name: T011 browser scenery smoke

on:
  push:
    branches:
      - roach/T011-chatgpt-nydrive-0831d
    paths:
      - .github/workflows/t011-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roach/T011-chatgpt-nydrive-0831d
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install project and browser
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/nydrive-vite.log 2>&1 &
          echo $! > /tmp/nydrive-vite.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nydrive-vite.log
          exit 1
      - name: Exercise real Flatiron scenery build
        run: |
          mkdir -p browser-smoke
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const errors = [];
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
          page.on('console', (message) => {
            if (message.type() === 'error') errors.push(`console: ${message.text()}`);
          });
          await page.goto('http://127.0.0.1:5173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(3500);
          const manifest = await page.evaluate(async () => (await fetch('/manifest.json')).json());
          const initialText = await page.locator('body').innerText();
          await page.screenshot({ path: 'browser-smoke/01-scenery.png', fullPage: true });
          await page.keyboard.press('r');
          await page.waitForTimeout(1500);
          const resetText = await page.locator('body').innerText();
          await page.screenshot({ path: 'browser-smoke/02-reset.png', fullPage: true });
          const result = {
            manifestBuildings: manifest?.scenery?.building_count ?? null,
            sourceHeightCount: manifest?.scenery?.source_height_count ?? null,
            fallbackHeightCount: manifest?.scenery?.fallback_height_count ?? null,
            initialText,
            resetText,
            errors,
          };
          fs.writeFileSync('browser-smoke/result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result));
          if (result.manifestBuildings !== 797) throw new Error(`Expected 797 buildings, got ${result.manifestBuildings}`);
          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: t011-browser-smoke
          path: browser-smoke
