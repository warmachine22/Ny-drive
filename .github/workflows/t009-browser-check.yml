name: T009 browser verification

on:
  push:
    branches:
      - roach/T009-chatgpt-nydrive-a830

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install project and browser tooling
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/nydrive-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nydrive-vite.log
          exit 1
      - name: Drive and capture
        run: |
          mkdir -p browser-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const consoleErrors = [];
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('pageerror', (error) => consoleErrors.push(`pageerror: ${error.message}`));

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1800);
          const initialStatus = await page.locator('.hud__status').innerText();
          await page.screenshot({ path: 'browser-artifacts/01-initial.png', fullPage: true });

          await page.keyboard.down('w');
          await page.waitForTimeout(1800);
          await page.keyboard.down('a');
          await page.waitForTimeout(900);
          await page.keyboard.up('a');
          await page.waitForTimeout(500);
          await page.keyboard.up('w');
          const drivingStatus = await page.locator('.hud__status').innerText();
          await page.screenshot({ path: 'browser-artifacts/02-driving.png', fullPage: true });

          await page.keyboard.press('r');
          await page.waitForTimeout(1200);
          const resetStatus = await page.locator('.hud__status').innerText();
          await page.screenshot({ path: 'browser-artifacts/03-reset.png', fullPage: true });

          fs.writeFileSync(
            'browser-artifacts/result.json',
            JSON.stringify({ initialStatus, drivingStatus, resetStatus, consoleErrors }, null, 2),
          );
          await browser.close();
          NODE
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: t009-browser-verification
          path: browser-artifacts
          if-no-files-found: error
