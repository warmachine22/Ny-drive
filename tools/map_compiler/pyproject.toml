[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nydrive-map-compiler"
version = "0.1.0"
description = "Offline geospatial normalization pipeline for Ny-drive"
requires-python = ">=3.11"
dependencies = [
  "pyproj==3.7.2",
  "rasterio==1.4.3",
  "shapely==2.1.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
